services:
  backend:
    build:
      context: ./backend
    container_name: jobtracker-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./data:/data
      # Sibling cv-resume repo — backend writes JD .md files into /cv-resume/jobs/inbox
      - ../cv-resume:/cv-resume
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/jobs.db
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8081

  frontend:
    build:
      context: ./frontend
    container_name: jobtracker-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5172:80"
    depends_on:
      - backend

