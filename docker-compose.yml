services:
  backend:
    build:
      context: ./backend
    container_name: jobtracker-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - jobtracker-data:/data
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/jobs.db
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080

  frontend:
    build:
      context: ./frontend
    container_name: jobtracker-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  jobtracker-data:
