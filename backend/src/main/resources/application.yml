server:
  address: 127.0.0.1
  port: 8081

spring:
  datasource:
    url: jdbc:sqlite:./data/jobs.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

cv-resume:
  # Filesystem path to the sibling cv-resume repo. Backend writes JD markdown
  # files to <path>/jobs/inbox/ on each create. Override via CV_RESUME_PATH env.
  path: ${CV_RESUME_PATH:../../cv-resume}

logging:
  level:
    org.hibernate.SQL: info
